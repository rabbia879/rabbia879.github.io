<!DOCTYPE html>
<html>
<head>
<title>Rabbia Rehman</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

form {
  background: white;
  padding: 30px;
  width: 350px;
  border-radius: 5px;
  box-shadow: 0 0 10px #ccc;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 10px 0 5px;
}

input, textarea {
  width: 100%;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

input[type="radio"], input[type="checkbox"] {
  width: auto;
}

input[type="submit"] {
  width: 100%;
  margin-top: 20px;
  padding: 10px;
  border: none;
  background: #222;
  color: white;
}

.error {
  background: red;
  color: white;
}
</style>

</head>
<body>

<form id="info">
<h2>Registration Form</h2>

<label>Full Name</label>
<input type="text" id="name" placeholder="Rabbia Rehman">

<label>Email</label>
<input type="text" id="email" placeholder="rabbia@email.com">

<label>Phone</label>
<input type="text" id="phone" placeholder="03XXXXXXXXX">

<label>Gender</label>
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Male"> Male

<label>Skills</label>
<input type="checkbox" name="skill"> HTML
<input type="checkbox" name="skill"> CSS
<input type="checkbox" name="skill"> JavaScript

<label>Message</label>
<textarea id="msg" rows="3" placeholder="Write something..."></textarea>

<input type="submit" value="Submit">
</form>


<script>
const form = document.querySelector("#info");
const nameField = document.querySelector("#name");
const emailField = document.querySelector("#email");
const phoneField = document.querySelector("#phone");
const msgField = document.querySelector("#msg");
const gender = document.getElementsByName("gender");
const skills = document.getElementsByName("skill");

function mark(field, condition) {
    if (!condition) {
        field.classList.add("error");
        return false;
    }
    field.classList.remove("error");
    return true;
}

form.addEventListener("submit", function(e) {
    let valid = true;

    valid &= mark(nameField, nameField.value.length >= 5);

    const emailPattern = /[^@]+@[^\.]+\..+/;
    valid &= mark(emailField, emailPattern.test(emailField.value));

    const phonePattern = /^03[0-9]{9}$/;
    valid &= mark(phoneField, phonePattern.test(phoneField.value));

    let genderValid = [...gender].some(r => r.checked);
    if (!genderValid) alert("Select gender");
    valid &= genderValid;

    let skillsValid = [...skills].some(c => c.checked);
    if (!skillsValid) alert("Select at least one skill");
    valid &= skillsValid;

    valid &= mark(msgField, msgField.value.trim().length >= 5);

    if (!valid) e.preventDefault();
});
</script>

</body>
</html>
