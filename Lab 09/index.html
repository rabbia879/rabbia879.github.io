<!DOCTYPE html>
<html>
<head>
    <title>Lazy Loading Demo</title>
    <style>
        body{font-family: Arial, sans-serif; margin: 0; padding: 0;}
        img{width:100%; max-width:900px; display:block; margin:40px auto; border:1px solid #ddd;}
    </style>
</head>
<body>

<h2 style="text-align:center;">Lazy Loading Screens</h2>

<!-- First screenshot loads normally -->
<img data-src="image 5.jpg" alt="Screenshot 2" loading="lazy">

<!-- Remaining images have data-src so they don't load initially -->

<img data-src="image 6.jpg" alt="Screenshot 3" loading="lazy">
<img data-src="image 7.jpg" alt="Screenshot 4" loading="lazy">
<img data-src="image 8.jpg" alt="Screenshot 5" loading="lazy">
<img data-src="image 1.jpg" alt="Screenshot 6" loading="lazy">
<img data-src="image 2.jpg" alt="Screenshot 7" loading="lazy">
<img data-src="image 3.jpg" alt="Screenshot 8" loading="lazy">
<img data-src="image 4.jpg" alt="Screenshot 9" loading="lazy">




<script>
const images = document.querySelectorAll('img[data-src]');

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            const img = entry.target;
            img.src = img.getAttribute('data-src');
            img.removeAttribute('data-src');
            observer.unobserve(img);
        }
    });
});

images.forEach(img => observer.observe(img));
</script>

</body>
</html>
